services:
  - type: web
    name: ragscan-backend
    env: docker
    plan: free
    rootDir: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN_REGEX
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FALLBACK_LLM_API_KEY
        sync: false
      - key: FALLBACK_LLM_MODEL
        sync: false
      - key: FALLBACK_LLM_MODELS
        sync: false
      - key: FALLBACK_LLM_BASE_URL
        sync: false
      - key: NVD_API_KEY
        sync: false
